<div class="research-input">
    <label for="input-research">Search by username :</label>
    <input type="text" id="input-research" [(ngModel)]="searchInput" [ngModelOptions]="{ standalone: true }"
        (input)="testSearch()">
</div>

<button (click)="testload()">Test 10 users</button>

<div class="user-list">
    <table mat-table [dataSource]="this.arrayUsers" class="mat-shadow-2">

        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef> Id </th>
            <td mat-cell *matCellDef="let user"> {{user.id}} </td>
        </ng-container>

        <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef> Username </th>
            <td mat-cell *matCellDef="let user"> {{user.username}} </td>
        </ng-container>

        <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef> Email </th>
            <td mat-cell *matCellDef="let user"> {{user.email}} </td>
        </ng-container>

        <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef> Role </th>
            <td mat-cell *matCellDef="let user"> {{user.role.name}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    <mat-paginator [pageSizeOptions]="[2, 3, 5]" showFirstLastButtons aria-label="Select page of users" (page)="onPageChange($event)">
    </mat-paginator>
</div>
