<div class="admin-page">
    <app-header></app-header>

    <mat-tab-group mat-stretch-tabs="true" mat-align-tabs="center" id="admin-tabs" (selectedTabChange)="onTabChanged($event)">
        <mat-tab label="Permissions">
            <app-permission-list [active]="selectedTab === 0"></app-permission-list>
        </mat-tab>
        <mat-tab label="Roles">
            <app-role-list [active]="selectedTab === 1"></app-role-list>
        </mat-tab>
        <mat-tab label="Users">Content 3</mat-tab>
    </mat-tab-group>
</div>
